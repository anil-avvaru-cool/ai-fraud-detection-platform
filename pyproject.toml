[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-fraud-detection-platform"
version = "0.1.0"
description = "AI Fraud Detection Platform — ensemble fraud scoring with graph intelligence"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "joblib>=1.4.0",
    "neo4j>=6.0.0",
    "numpy>=2.0.0",
    "pandas>=3.0.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "redis>=7.0.0",
    "scikit-learn>=1.5.0",
    "shap>=0.45.0",
    "uvicorn[standard]>=0.30.0",
    "xgboost>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = [
    "api",
    "adversarial",
    "decision_engine",
    "explainability",
    "fraud_scoring",
    "inference",
    "investigator_copilot",
    "monitoring",
]
